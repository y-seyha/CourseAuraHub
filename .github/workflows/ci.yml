name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      # npm ci needs package-lock.json to match package.json exactly, and the committed one is behind
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npx eslint .
      - name: Type check
        run: npx -y -p typescript@5.9 -p vue-tsc@3 vue-tsc --noEmit -p .nuxt/tsconfig.app.json
      - name: Build
        run: npm run build
